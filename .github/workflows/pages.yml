name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Inject Formspree form ID
        env:
          FORM_ID: ${{ secrets.FORMSPREE_FORM_ID }}
        run: |
          test -n "$FORM_ID" || { echo "FORMSPREE_FORM_ID secret is not set"; exit 1; }
          mkdir _dist
          cp -r index.html 404.html styles.css main.js CNAME robots.txt sitemap.xml assets _dist/
          sed -i "s/YOUR_FORM_ID/${FORM_ID}/" _dist/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          # Only the landing page is published. archive/ and docs/ stay in the repo but are never served.
          path: _dist
      - id: deployment
        uses: actions/deploy-pages@v4
